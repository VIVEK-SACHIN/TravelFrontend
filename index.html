<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:300,300i,700"
    />

    <title>TravelAndTour</title>

    <script>
      (function () {
        var themeKey = 'travel-ui-theme';
        var modeKey = 'travel-ui-color-mode';
        var theme = 'green';
        var mode = 'light';

        try {
          var storedTheme = localStorage.getItem(themeKey);
          if (storedTheme) theme = storedTheme;

          var storedMode = localStorage.getItem(modeKey);
          if (storedMode) mode = storedMode;
        } catch (e) {}

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-color-mode', mode);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- IMPORTANT: Vite will inject correct path during build -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
